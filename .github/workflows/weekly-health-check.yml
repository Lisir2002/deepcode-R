name: Weekly Health Check

# 每周一早上 8 点（北京时间）自动运行全量健康检查：
#   - 全量构建（debug + release）
#   - 全量单元测试
#   - Lint 检查
#   - 构建产物大小监控
# 也可手动触发。

on:
  schedule:
    # 每周一 00:00 UTC = 周一 08:00 北京时间
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  health-check:
    name: Weekly Health Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install fixed debug keystore
        env:
          FIXED_DEBUG_KS_B64: ""
        run: |
          set -e
          mkdir -p ~/.android
          printf '%s' "$FIXED_DEBUG_KS_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 1. Lint 检查
      - name: Run Lint (release)
        run: ./gradlew :app:lintRelease --stacktrace
        continue-on-error: true

      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30

      # 2. 单元测试（debug + release 双变体）
      - name: Run unit tests (debug)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Run unit tests (release)
        run: ./gradlew :app:testReleaseUnitTest --stacktrace
        continue-on-error: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 30

      # 3. 全量构建
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        continue-on-error: true

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      # 4. 产物大小统计
      - name: Collect build metrics
        id: metrics
        run: |
          set -e
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"

          echo "=== APK 大小统计 ==="
          if [[ -f "$debug_apk" ]]; then
            debug_size=$(stat -c%s "$debug_apk")
            debug_mb=$(echo "scale=2; $debug_size / 1024 / 1024" | bc)
            echo "Debug APK: ${debug_mb} MB"
            echo "debug_apk_mb=${debug_mb}" >> "$GITHUB_OUTPUT"
          else
            echo "Debug APK: 构建失败"
          fi

          if [[ -f "$release_apk" ]]; then
            release_size=$(stat -c%s "$release_apk")
            release_mb=$(echo "scale=2; $release_size / 1024 / 1024" | bc)
            echo "Release APK: ${release_mb} MB"
            echo "release_apk_mb=${release_mb}" >> "$GITHUB_OUTPUT"
          else
            echo "Release APK: 构建失败"
          fi

          # method count (DEX 方法数)
          if [[ -f "$release_apk" ]]; then
            method_count=$(unzip -p "$release_apk" classes.dex 2>/dev/null | head -c 92 | tail -c 4 | od -An -tu4 | tr -d ' ')
            echo "DEX method count: ${method_count:-N/A}"
            echo "dex_method_count=${method_count:-0}" >> "$GITHUB_OUTPUT"
          fi

          # commit count (= versionCode)
          vc=$(git rev-list --count HEAD)
          echo "versionCode (commit count): $vc"
          echo "version_code=${vc}" >> "$GITHUB_OUTPUT"

      # 5. 生成健康检查摘要
      - name: Generate health check summary
        if: always()
        run: |
          {
            echo "## 🏥 每周健康检查报告"
            echo ""
            echo "- **日期**: $(date '+%Y-%m-%d')"
            echo "- **版本**: $(git rev-list --count HEAD) commits @ $(git rev-parse --short HEAD)"
            echo ""
            echo "### 📊 构建产物"
            echo ""
            echo "| 指标 | 值 |"
            echo "|---|---|"
            echo "| Debug APK | $([ -f app/build/outputs/apk/debug/app-debug.apk ] && echo "$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)" || echo "❌ 构建失败") |"
            echo "| Release APK | $([ -f app/build/outputs/apk/release/app-release.apk ] && echo "$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)" || echo "❌ 构建失败") |"
            echo ""
            echo "### ✅ 检查项"
            echo ""
            echo "- Lint: $([ -f app/build/reports/lint-results-release.html ] && echo '✅ 已完成' || echo '⏭️ 跳过')"
            echo "- Debug 单测: $([ -d app/build/reports/tests/testDebugUnitTest ] && echo '✅ 已完成' || echo '⏭️ 跳过')"
            echo "- Release 单测: $([ -d app/build/reports/tests/testReleaseUnitTest ] && echo '✅ 已完成' || echo '⏭️ 跳过')"
            echo ""
            echo "### 📎 附件"
            echo "- Lint 报告: lint-report artifact"
            echo "- 测试报告: test-reports artifact"
          } >> "$GITHUB_STEP_SUMMARY"
