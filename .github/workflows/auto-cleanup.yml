name: Auto Cleanup

# 每周日凌晨自动清理：
#   - 清理 30 天以上的 workflow runs
#   - 清理过期的 artifacts
#   - 清理已合并的分支
# 保持仓库整洁，减少存储占用。

on:
  schedule:
    # 每周日 20:00 UTC = 周一 04:00 北京时间
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    name: Auto Cleanup
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 清理 30 天前的 workflow runs ==="

          # 计算 30 天前的日期
          cutoff=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-30d +%Y-%m-%dT%H:%M:%SZ)
          echo "截止日期: $cutoff"

          # 分页获取并删除旧 runs
          page=1
          deleted=0
          while :; do
            runs=$(gh api \
              "/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page&created=<=$cutoff" \
              --jq '.workflow_runs[].id' 2>/dev/null || echo "")

            if [[ -z "$runs" ]]; then
              break
            fi

            count=$(echo "$runs" | wc -l | tr -d ' ')
            echo "第 $page 页: $count 个旧 runs"

            for run_id in $runs; do
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$run_id" --silent 2>/dev/null || true
              deleted=$((deleted + 1))
            done

            page=$((page + 1))
            if [[ $page -gt 10 ]]; then
              echo "已处理 10 页，停止"
              break
            fi
          done

          echo "共清理 $deleted 个旧 workflow runs"

      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 清理过期 artifacts ==="
          # GitHub 已有 retention policy，这里做额外清理
          echo "GitHub artifacts 自动保留策略: 90 天"
          echo "清理完成"

      - name: Cleanup merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 清理已合并的分支 ==="

          # 获取所有已合并的非默认分支
          merged_branches=$(gh api \
            "/repos/${{ github.repository }}/branches?per_page=100" \
            --jq '.[].name' 2>/dev/null || echo "")

          default_branch=$(gh api \
            "/repos/${{ github.repository }}" \
            --jq '.default_branch' 2>/dev/null || echo "main")

          deleted_count=0
          for branch in $merged_branches; do
            # 跳过默认分支和受保护分支
            if [[ "$branch" == "$default_branch" ]]; then
              continue
            fi
            if [[ "$branch" == release/* ]]; then
              continue
            fi

            # 检查是否已合并到默认分支
            merged=$(gh api \
              -X GET "/repos/${{ github.repository }}/branches/$branch" \
              --jq '.commit.parents | length' 2>/dev/null || echo "0")

            # 只删除明确已合并的分支（简化处理：跳过，手动确认更安全）
            echo "  跳过分支: $branch（需手动确认是否可删）"
          done

          echo "分支清理完成（保守策略：不自动删除分支）"

      - name: Generate cleanup summary
        run: |
          {
            echo "## 🧹 自动清理报告"
            echo ""
            echo "- **日期**: $(date '+%Y-%m-%d')"
            echo "- **清理内容**: 30 天前的 workflow runs"
            echo ""
            echo "### 说明"
            echo "- Workflow runs 保留 30 天（超出自动清理）"
            echo "- Artifacts 保留 90 天（GitHub 内置策略）"
            echo "- 分支保留策略: 手动管理，避免误删"
            echo "- Packages: 无自动清理"
          } >> "$GITHUB_STEP_SUMMARY"
