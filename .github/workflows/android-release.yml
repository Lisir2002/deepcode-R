name: Android Release

# 打 Tag（如 v1.0.0）时触发：构建真机单架构 Release APK（arm64-v8a only）
#   - 发布产物显式带 arm64 标签，避免用户误装到 x86_64 模拟器（安装阶段即失败，不会运行期崩溃）。
#   - x86_64 模拟器如需开发使用，本地临时切回 abiFilters=[arm64-v8a,x86_64] 或 sourceSets 挂 _x86Assets 即可。
# 创建 GitHub Release 并把 APK 作为资产发布。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发，便于验证构建链路。
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 与上传资产需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 取 git rev-list --count HEAD，
          # 浅克隆（默认 depth=1）会得到 1，必须拉完整历史，否则 Release APK 版本号错乱。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # CI 跑 Ubuntu runner：自动生成 debug keystore 供 signingConfigs.release/androidDebug 回退使用。
      # 必须放在 Set up JDK 之后（keytool 是 JDK bin 下的工具，JAVA_HOME 未注入前调不到）。
      # 如果有正式 keystore（secrets.AICODE_KEYSTORE_BASE64），下面的步骤会覆盖本步骤生成的；
      # 如果没有，则 release 会自动回退到本步骤生成的 debug keystore，保证 assembleRelease 不崩。
      - name: Generate debug keystore (CI fallback signing)
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          mkdir -p ~/.android
          if [[ ! -f ~/.android/debug.keystore ]]; then
            "$JAVA_HOME/bin/keytool" -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "debug keystore created at ~/.android/debug.keystore"
            ls -lh ~/.android/debug.keystore
          else
            echo "debug keystore already exists, skip creation"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # android-actions/setup-android@v3 只接受 cmdline-tools-version + packages 两个参数：
          #   cmdline-tools-version 对应 cmdline-tools zip 版本号（见 action.yml 默认 14742923 = 20.0）
          #   packages 用 sdkmanager 语法传，多包空格分隔；platforms + build-tools 是构建必须
          cmdline-tools-version: '14742923'
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 复用 Gradle 构建缓存，加速后续构建。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew + env sanity
        run: |
          set -e
          chmod +x ./gradlew
          echo "--- build env sanity ---"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la gradle.properties gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle properties (without sensitive values) ---"
          grep -vE '^(systemProp\.)' gradle.properties || true

      # 打印当前 Tag，Tag 驱动直接生成 versionName。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Display release tag info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag_ver="${GITHUB_REF_NAME#v}"            # 1.7.0 / 1.7.0-rc1 / ...
          echo "tag version (without v) = $tag_ver"
          echo "✓ tag 将直接驱动应用 versionName ($tag_ver)"

      # 校验 versionCode 单调递增：versionCode = git commit count，rebase/squash 改写历史
      # 可能让 commit count 变小，导致新版本 versionCode < 旧版本、升级判定失效。
      # 取按提交时间倒序最近的非当前 tag，算其 commit count，要求当前 HEAD 不小于上个 Release。
      # 允许相等：rc 转正式版时常在同一提交上打 tag，versionCode 相等是正常的。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify versionCode monotonic
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          cur_vc=$(git rev-list --count HEAD)
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${GITHUB_REF_NAME}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，跳过 versionCode 单调校验（首次发版）"
            echo "当前 versionCode(commit count) = $cur_vc"
            exit 0
          fi
          prev_vc=$(git rev-list --count "$prev_tag")
          echo "上个 Release($prev_tag) versionCode = $prev_vc"
          echo "当前(${GITHUB_REF_NAME}) versionCode     = $cur_vc"
          if [[ "$cur_vc" -lt "$prev_vc" ]]; then
            echo "::error::versionCode 回退: 当前 $cur_vc < 上个 Release($prev_tag) $prev_vc。通常因 rebase/squash 改写历史使 commit count 变小。请确保新版本在旧 tag 之上线性推进。"
            exit 1
          fi
          echo "✓ versionCode 单调递增: $prev_vc -> $cur_vc"

      - name: Restore release keystore
        env:
          # keystore 文件以 base64 存入 Secret，避免二进制文件被破坏。
          # 还原到 app/rdeepcode.jks，与 build.gradle.kts 期望的位置一致。
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/rdeepcode.jks
          echo "keystore restored ($(stat -c%s app/rdeepcode.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=rdeepcode.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "app/keystore.properties generated"

      # 发版质量门禁：跑 release 变体单元测试（用户策略 = 所有测试/验证都用发行版），
      # 与用户实际安装的 release classpath 一致，不再被 debug 专用代码路径掩盖。
      # （纯 JVM 单测不依赖真机 ABI，与 arm64-only 的打包策略无冲突。）
      # --warning-mode=all + --stacktrace：失败时完整输出弃用告警与异常栈，避免在 CI 再猜。
      - name: Run unit tests (release)
        run: ./gradlew --warning-mode=all :app:testReleaseUnitTest --stacktrace

      # 构建真机单架构 release APK（arm64-v8a only，见 build.gradle.kts abiFilters 与 sourceSets）
      # --warning-mode=all + --stacktrace：失败时完整输出，便于在 CI 一眼定位 R8/打包/OOM 根因
      - name: Build Release APK
        run: ./gradlew --warning-mode=all assembleRelease --stacktrace

      # 重命名 APK 为「品牌-arm64-版本」格式（真机单架构，显式带 ABI 标签）：
      #   rdeepcode-arm64-v1.0.0-rc1.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-manual}"   # tag 如 v1.0.0-rc1；手动触发时为 manual-N
          src="app/build/outputs/apk/release/app-release.apk"
          if [[ -f "$src" ]]; then
            out="dist/rdeepcode-arm64-${ver}.apk"
            cp "$src" "$out"
            echo "packaged $out"
            ls -lh "$out"
          else
            echo "::error::missing $src — assembleRelease 产出未找到，请检查 build.gradle.kts 已移除 flavor 且 abiFilters=arm64-v8a。"
            exit 1
          fi

      - name: Determine release name
        id: release
        run: |
          # 手动触发（无 tag）时用 run id 作为临时名，避免破坏 tag 发布。
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine prerelease flag
        id: prerelease
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if [[ "$tag" =~ -(rc|dev|beta|alpha)([.0-9]*)?$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "检测到预发布后缀，标记为 pre-release"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "正式版，不标记 pre-release"
          fi

      # GitHub 的 generate_release_notes 只列 merged PR，直接 push 的 commit 不会出现。
      # 本仓库在 main 上直接 commit，不走 PR 流程，所以手动用 git log 生成 changelog。
      - name: Generate changelog from git log
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${cur_tag}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，列出最近 30 条提交"
            log=$(git log --oneline --no-decorate -30)
          else
            echo "生成 ${prev_tag}..${cur_tag} 的 changelog"
            log=$(git log --oneline --no-decorate "${prev_tag}..HEAD")
          fi
          # 转义为 GitHub Actions 输出（多行用 EOF 分隔符）
          delimiter="EOF_$(date +%s)"
          echo "body<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "## What's Changed" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$log" | while IFS= read -r line; do
            # 提取 commit hash 和 message，格式化为列表项
            sha=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)
            echo "- ${msg} (${sha})" >> "$GITHUB_OUTPUT"
          done
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${cur_tag}" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          # 产物名约定 rdeepcode-arm64-<版本>.apk（见 Rename 步骤），版本段用 * 兼容 tag/manual-*。
          files: |
            dist/rdeepcode-arm64-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
