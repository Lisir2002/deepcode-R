name: Android Release

# 打 Tag（如 v1.0.0）时触发：构建「真机 + 虚拟环境通用」的 Release APK（双 ABI：arm64-v8a + x86_64）。
#   - 单包通用（用户决策「不分包」）：同一 APK 同时携带 arm64-v8a 与 x86_64 两套原生库，
#     Android 包管理器安装/运行期按设备 ABI 自动选用——真机（arm64）与 x86_64 模拟器都安装即用，
#     无需用户选择、不存在「误装到 x86_64 模拟器」的问题（详见 docs/plan-docs/emulator-support-design.md）。
#   - 容器 rootfs 同理双架构打入（container/arm + container/x86_64），运行时按宿主架构选装/选用。
# 创建 GitHub Release 并把 APK 作为资产发布。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发，便于验证构建链路。
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 与上传资产需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 取 git rev-list --count HEAD，
          # 浅克隆（默认 depth=1）会得到 1，必须拉完整历史，否则 Release APK 版本号错乱。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # CI 跑 Ubuntu runner：写入「项目级固定 debug keystore」供 signingConfigs.release/androidDebug 回退使用。
      # 必须放在 Set up JDK 之后（keytool 是 JDK bin 下的工具，JAVA_HOME 未注入前调不到）。
      #
      # —— 为什么不用 keytool -genkey 每次随机生成？——
      #   keytool -genkey 会在每次 run 生成完全随机的 RSA 密钥对 → 不同 Tag 构建出来的 APK 签名 SHA256 不一样 →
      #   安装时会因「同包名签名不同」报「软件包与现有软件包存在冲突」，所有 RC 版本之间不能覆盖升级，只能卸载重装。
      #   因此我们在 repo 中固化一份 debug keystore 的 base64：虽然 debug keystore 仅用于回退（非上架签名），
      #   但只要签名证书稳定，用户从 rc23→rc24→rc25→正式版之间都能 OTA 式覆盖升级，不用每次清数据。
      #
      # 如果有正式 keystore（secrets.AICODE_KEYSTORE_BASE64），下面的 "Restore release keystore" 步骤会
      # 用 AICODE_KEYSTORE_BASE64 在 app/rcodecore.jks 生成一份不同的 keystore，并写 app/keystore.properties
      # 指向它 → Gradle 的 signingConfigs.release 会优先生效 → 产物为正式签名（SHA256 另算但同样稳定）。
      #
      # 若 secrets 未配置（绝大多数测试/迭代场景）：Restore release keystore 跳过 → 本步骤写的
      # ~/.android/debug.keystore 生效，alias=androiddebugkey / storePassword=android / keyPassword=android，
      # APK 签名证书 SHA256 固定 = 7A:D5:EA:0E:3F:A9:6F:10:26:29:21:0C:9C:DB:AA:81:E3:CE:D4:9B:32:20:A5:21:7B:64:EC:1A:95:D2:FA:C8。
      - name: Install fixed debug keystore (CI fallback signing — stable across runs)
        env:
          # 项目级固定 debug keystore 的 base64（keytool -genkeypair 一次性生成后永远不变）。
          # 规格：RSA 2048 / SHA384withRSA / 有效期 10000 天
          #       / CN=Android Debug, O=Android, C=US
          #       / alias=androiddebugkey, storePassword=android, keyPassword=android
          # 对应 APK 级签名证书 SHA256（keytool -printcert -jarfile *.apk 查看）：
          #   7A:D5:EA:0E:3F:A9:6F:10:26:29:21:0C:9C:DB:AA:81:E3:CE:D4:9B:32:20:A5:21:7B:64:EC:1A:95:D2:FA:C8
          FIXED_DEBUG_KS_B64: ""
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          mkdir -p ~/.android
          # 直接用 base64 还原：保证跨 workflow run 同一个 keystore、同一个 RSA key
          printf '%s' "$FIXED_DEBUG_KS_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          echo "✓ fixed debug keystore installed at ~/.android/debug.keystore"
          ls -lh ~/.android/debug.keystore
          # 完整性 & 指纹自检（任何篡改/损坏会立即暴露，避免后面 Gradle 报莫名签名错误）
          "$JAVA_HOME/bin/keytool" -list -v -keystore ~/.android/debug.keystore -storepass android \
            | grep -E "Alias name|Owner|SHA256" | head -6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # android-actions/setup-android@v3 只接受 cmdline-tools-version + packages 两个参数：
          #   cmdline-tools-version 对应 cmdline-tools zip 版本号（见 action.yml 默认 14742923 = 20.0）
          #   packages 用 sdkmanager 语法传，多包空格分隔；platforms + build-tools 是构建必须
          cmdline-tools-version: '14742923'
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 复用 Gradle 构建缓存，加速后续构建。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew + env sanity
        run: |
          set -e
          chmod +x ./gradlew
          echo "--- build env sanity ---"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la gradle.properties gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle properties (without sensitive values) ---"
          grep -vE '^(systemProp\.)' gradle.properties || true

      # 打印当前 Tag，Tag 驱动直接生成 versionName。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Display release tag info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag_ver="${GITHUB_REF_NAME#v}"            # 1.7.0 / 1.7.0-rc1 / ...
          echo "tag version (without v) = $tag_ver"
          echo "✓ tag 将直接驱动应用 versionName ($tag_ver)"

      # 校验 versionCode 单调递增：versionCode = git commit count，rebase/squash 改写历史
      # 可能让 commit count 变小，导致新版本 versionCode < 旧版本、升级判定失效。
      # 取按提交时间倒序最近的非当前 tag，算其 commit count，要求当前 HEAD 不小于上个 Release。
      # 允许相等：rc 转正式版时常在同一提交上打 tag，versionCode 相等是正常的。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify versionCode monotonic
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          cur_vc=$(git rev-list --count HEAD)
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${GITHUB_REF_NAME}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，跳过 versionCode 单调校验（首次发版）"
            echo "当前 versionCode(commit count) = $cur_vc"
            exit 0
          fi
          prev_vc=$(git rev-list --count "$prev_tag")
          echo "上个 Release($prev_tag) versionCode = $prev_vc"
          echo "当前(${GITHUB_REF_NAME}) versionCode     = $cur_vc"
          if [[ "$cur_vc" -lt "$prev_vc" ]]; then
            echo "::error::versionCode 回退: 当前 $cur_vc < 上个 Release($prev_tag) $prev_vc。通常因 rebase/squash 改写历史使 commit count 变小。请确保新版本在旧 tag 之上线性推进。"
            exit 1
          fi
          echo "✓ versionCode 单调递增: $prev_vc -> $cur_vc"

      - name: Restore release keystore (if secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          # 如果 Secrets 未配置则跳过，后续 assembleRelease 会回退到 debug keystore。
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/rcodecore.jks
            echo "keystore restored ($(stat -c%s app/rcodecore.jks) bytes)"
          else
            echo "AICODE_KEYSTORE_BASE64 not set — skipping release keystore restore, will use debug keystore fallback."
          fi

      - name: Generate keystore.properties (if secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          # 仅当 release keystore 存在时才生成 properties 文件。
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf 'storeFile=rcodecore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties
            echo "app/keystore.properties generated"
          else
            echo "Release keystore secrets not fully configured — skipping keystore.properties, will use debug keystore fallback."
          fi

      # 发版质量门禁：跑 release 变体单元测试（用户策略 = 所有测试/验证都用发行版），
      # 与用户实际安装的 release classpath 一致，不再被 debug 专用代码路径掩盖。
      # （纯 JVM 单测不依赖真机 ABI，与 arm64-only 的打包策略无冲突。）
      # --warning-mode=all + --stacktrace：失败时完整输出弃用告警与异常栈，避免在 CI 再猜。
      - name: Run unit tests (release)
        run: ./gradlew --warning-mode=all :app:testReleaseUnitTest --stacktrace

      # 构建通用 release APK（双 ABI：arm64-v8a + x86_64，见 build.gradle.kts abiFilters 与 sourceSets）
      # --warning-mode=all + --stacktrace：失败时完整输出，便于在 CI 一眼定位 R8/打包/OOM 根因
      - name: Build Release APK
        run: ./gradlew --warning-mode=all assembleRelease --stacktrace

      # 重命名 APK 为「品牌-版本」格式（单包通用，双 ABI 一并打入，不带 ABI 标签）：
      #   rcodecore-v1.0.0-rc1.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-manual}"   # tag 如 v1.0.0-rc1；手动触发时为 manual-N
          src="app/build/outputs/apk/release/app-release.apk"
          if [[ -f "$src" ]]; then
            out="dist/rcodecore-${ver}.apk"
            cp "$src" "$out"
            echo "packaged $out"
            ls -lh "$out"
            # 产物校验：通用包必须同时包含 arm64-v8a 与 x86_64 两套原生库（解 zip 列出 lib/ 下架构目录）
            echo "--- ABI 校验：lib/ 下应有 arm64-v8a 与 x86_64 ---"
            unzip -l "$out" | awk '/\.so$/ {print $4}' | awk -F/ 'NF>=3 {print $2}' | sort -u
            has_arm=$(unzip -l "$out" | grep -c 'lib/arm64-v8a/.*\.so' || true)
            has_x86=$(unzip -l "$out" | grep -c 'lib/x86_64/.*\.so' || true)
            if [[ "$has_arm" -eq 0 || "$has_x86" -eq 0 ]]; then
              echo "::error::ABI 校验失败：arm64-v8a($has_arm) / x86_64($has_x86) 未同时包含，请检查 build.gradle.kts abiFilters=[arm64-v8a,x86_64] 与双架构资产。"
              exit 1
            fi
            echo "✓ ABI 校验通过：arm64-v8a + x86_64 双架构齐备"
          else
            echo "::error::missing $src — assembleRelease 产出未找到，请检查 build.gradle.kts 已移除 flavor 且 abiFilters 含 arm64-v8a 与 x86_64。"
            exit 1
          fi

      # 上传 R8 mapping.txt 作为 Run artifact（仅 release build 才会产出）。
      # 用于线上 crash stack 反混淆与版本回溯。文件不存在时跳过，不阻塞流程。
      - name: Upload R8 mapping (Run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # RC70 新增：独立上传 APK artifact（Rename → Release 创建之间的安全网）
      # 即使 Create GitHub Release step 因 tag 竞态 / GITHUB_TOKEN 权限失败，APK 仍在 Run Artifacts 内 90 天可下载。
      - name: Upload release APK (Run artifact safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: dist/rcodecore-*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Determine release name
        id: release
        run: |
          # 手动触发（无 tag）时用 run id 作为临时名，避免破坏 tag 发布。
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine prerelease flag
        id: prerelease
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if [[ "$tag" =~ -(rc|dev|beta|alpha)([.0-9]*)?$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "检测到预发布后缀，标记为 pre-release"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "正式版，不标记 pre-release"
          fi

      # GitHub 的 generate_release_notes 只列 merged PR，直接 push 的 commit 不会出现。
      # 本仓库在 main 上直接 commit，不走 PR 流程，所以手动用 git log 生成 changelog。
      - name: Generate changelog from git log
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${cur_tag}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，列出最近 30 条提交"
            log=$(git log --oneline --no-decorate -30)
          else
            echo "生成 ${prev_tag}..${cur_tag} 的 changelog"
            log=$(git log --oneline --no-decorate "${prev_tag}..HEAD")
          fi
          # 转义为 GitHub Actions 输出（多行用 EOF 分隔符）
          delimiter="EOF_$(date +%s)"
          echo "body<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "## What's Changed" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$log" | while IFS= read -r line; do
            # 提取 commit hash 和 message，格式化为列表项
            sha=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)
            echo "- ${msg} (${sha})" >> "$GITHUB_OUTPUT"
          done
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${cur_tag}" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload assets
        uses: softprops/action-gh-release@v2
        id: gh_release
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          # 产物名约定 rcodecore-<版本>.apk（见 Rename 步骤），版本段用 * 兼容 tag/manual-*。
          files: |
            dist/rcodecore-*.apk
        env:
          # RC70 修复：softprops action 对 tag/release 写操作 + 附件 upload 用 GH_RELEASE_TOKEN (细粒度 PAT)，
          # 避免默认 secrets.GITHUB_TOKEN 在 tag 已经存在 + repo 限制 Release write / tag push 时竞态失败。
          # 回退：secrets.GH_RELEASE_TOKEN 未配置时自动回退为 GITHUB_TOKEN（保持原行为）。
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # 把版本号、prerelease 标志、APK 下载链接、Release 页面写入 Run Summary，
      # 方便 AI / 维护者通过 GitHub API 或 Actions 页面一眼定位产物（与 docs/ci-release.md 云端构建发版运维手册 对齐）。
      - name: Write download URLs to Run Summary
        if: always()
        env:
          TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
        run: |
          apk="dist/rcodecore-${TAG}.apk"
          sha256="$(sha256sum "$apk" 2>/dev/null | cut -d' ' -f1 || echo unavailable)"
          {
            echo "## R-CodeCore Release — ${TAG}"
            echo ""
            echo "- **Prerelease**: ${IS_PRERELEASE}"
            echo "- **APK**: \`rcodecore-${TAG}.apk\` (双 ABI 通用包：arm64-v8a + x86_64)"
            echo "- **SHA256**: \`${sha256}\`"
            echo "- **Release page**: https://github.com/${REPO}/releases/tag/${TAG}"
            echo "- **Artifact**: r8-mapping-${TAG} (Run artifact, 90d retention)"
          } >> "$GITHUB_STEP_SUMMARY"
