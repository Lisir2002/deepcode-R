name: CI

# push 到 main 或 PR 时触发：构建 universal debug（单 flavor 冒烟）+ 跑单元测试。
# 目的是合入前的兜底门禁，避免编译错误/回归推迟到打 tag 发版当天才暴露。
# 打 v* tag 的发版构建走 android-release.yml，不在这里。
on:
  push:
    branches: [ main ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: 'latest'
          platform: 'android-36'
          build-tools: '36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 用只读缓存，仅 main 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 构建收敛为单一变体：只用 debug（已含 arm64 + x86 两套 ABI 与容器镜像），
      # 真机与模拟器共用同一套产物，不再拆 flavor → 省 2/3 构建时间。
      - name: Build debug (smoke)
        run: ./gradlew :app:assembleDebug --stacktrace

      # 单元测试（app/src/test 下的 Kotlin 单测）。
      # 只跑 debug 变体：单测逻辑与构建类型无关，跑全量变体是重复编译，无额外覆盖。
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
