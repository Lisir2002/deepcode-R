name: CI

# push 到 main 或 PR 时触发：构建 release（签名不存在则 unsigned）+ 跑 release 变体单元测试。
# 用户策略：所有测试/验证都用发行版（release），不打 debug，也不发 debug。
# 所以 CI 门禁统一跑 release 链路：
#   :app:assembleRelease        — R8 fullMode + 资源收缩 + DEX/SO ZIP 压缩都走一遍，
#                                 真正验证"即将发出的包"能不能构出来（14MB 级最终产物）。
#   :app:testReleaseUnitTest    — 纯 JVM 单测在 release classpath 下跑，
#                                 与将来用户安装的 release 运行时一致（debug 专用代码路径不再被掩盖）。
# 打 v* tag 的正式发版构建走 android-release.yml（额外有 keystore 还原 + Release 页上传），不在这里。
on:
  push:
    branches: [ main ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: 'latest'
          platform: 'android-36'
          build-tools: '36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 用只读缓存，仅 main 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 构建收敛为单一 release 变体：真机 arm64-v8a 单架构（已开 R8 fullMode + shrinkResources
      # + useLegacyPackaging=false），验证"用户真正会下载安装的发布包"能否完整编出来。
      # 签名配置缺失时输出 app-release-unsigned.apk（仍可用于冒烟和结构检查），
      # 有 keystore 的正式发布走 android-release.yml。
      - name: Build release (smoke)
        run: ./gradlew :app:assembleRelease --stacktrace

      # 单元测试（app/src/test 下的 Kotlin 单测），在 release 变体 classpath 下执行：
      # 与用户拿到的最终发布包运行时一致，避免 debug-only 代码掩盖问题。
      - name: Run unit tests (release)
        run: ./gradlew :app:testReleaseUnitTest
