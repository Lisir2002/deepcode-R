<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>web-demo · HTML + PHP 演示</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --primary: #4f6ef7;
    --primary-dark: #3b54d6;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --off: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; align-items: center; }
  .toolbar button {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); }
  .toolbar button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .status-line { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .status-line .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; transition: transform .12s, box-shadow .12s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(31,36,48,.08); }
  .card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card .name { font-size: 16px; font-weight: 600; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .badge.ok { background: #dcfce7; color: var(--ok); }
  .badge.off { background: #fef3c7; color: var(--off); }
  .card .role { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .card .score { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .bar { flex: 1; height: 6px; border-radius: 999px; background: #eef1f6; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
  .empty, .error { text-align: center; color: var(--muted); padding: 40px 0; }
  .error { color: #dc2626; }
  footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>web-demo · 数据面板</h1>
      <div class="sub">前端 <code>fetch</code> 调用 <code>api.php</code>，展示返回数据</div>
    </div>
    <div class="toolbar">
      <button id="btn-all" class="active">全部</button>
      <button id="btn-active">仅启用</button>
      <button id="btn-refresh">刷新</button>
    </div>
  </header>

  <div class="status-line"><span class="dot" id="dot"></span><span id="status-text">正在加载…</span></div>
  <div class="grid" id="grid"></div>
  <footer>HTML + PHP 零依赖演示 · 由 api.php 返回 JSON</footer>
</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var statusText = document.getElementById('status-text');
  var dot = document.getElementById('dot');
  var currentType = ''; // '' | 'active'

  function render(data) {
    if (!data.length) {
      grid.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    grid.innerHTML = data.map(function (row) {
      var ok = row.status === '启用';
      var badge = ok ? 'ok' : 'off';
      return '<div class="card">' +
        '<div class="head"><span class="name">' + row.name + '</span>' +
        '<span class="badge ' + badge + '">' + row.status + '</span></div>' +
        '<div class="role">' + row.role + ' · ID ' + row.id + '</div>' +
        '<div class="score"><span>评分</span><div class="bar"><i style="width:' + row.score + '%"></i></div><span>' + row.score + '</span></div>' +
        '</div>';
    }).join('');
  }

  function setStatus(text, ok) {
    statusText.textContent = text;
    dot.style.background = ok ? '#16a34a' : '#dc2626';
  }

  function load() {
    setStatus('正在加载…', true);
    var url = currentType ? 'api.php?type=' + currentType : 'api.php';
    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json.ok) throw new Error(json.error || '接口返回异常');
        render(json.data);
        setStatus('共 ' + json.total + ' 条记录' + (currentType ? '（仅启用）' : '（全部）'), true);
      })
      .catch(function (err) {
        grid.innerHTML = '<div class="error">加载失败：' + err.message + '</div>';
        setStatus('加载失败', false);
      });
  }

  function setType(type, btn) {
    currentType = type;
    document.getElementById('btn-all').classList.toggle('active', type === '');
    document.getElementById('btn-active').classList.toggle('active', type === 'active');
    load();
  }

  document.getElementById('btn-all').addEventListener('click', function () { setType('', this); });
  document.getElementById('btn-active').addEventListener('click', function () { setType('active', this); });
  document.getElementById('btn-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
