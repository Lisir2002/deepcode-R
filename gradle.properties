org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true
# 不要把 org.gradle.java.home 硬编码写进仓库（.gradle 放了就是全局影响，CI Ubuntu runner / 别人 clone 下来
# 都不会有 "/root/.local/share/mise/installs/java/17.0.2" 这个本机专用路径，Gradle 会直接报 Java home 不存在退出）。
# Gradle 会自动按优先级找 JDK：命令行 -Dorg.gradle.java.home -> 本文件 org.gradle.java.home ->
#   JAVA_HOME 环境变量 -> java on PATH，所以 CI 靠 setup-java@v5 注入 JAVA_HOME 即可，
#   本地开发如果要指定某个 JDK，在 local.properties / gradle-local.properties / 个人环境变量里配，不要入库。
# org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2

# 2 核 7GB runner 内存预算：daemon 堆给 2048m，留余量给 R8/KSP/系统。
# 原 4096m 过大，R8/KSP 并发时易与 daemon 抢内存导致 OOM。

# Kotlin 编译改 in-process：跑进 Gradle daemon，省掉独立的 Kotlin daemon JVM（再省一份内存）。
# 官方推荐策略之一，详见 kotlin.compiler.execution.strategy。
kotlin.compiler.execution.strategy=in-process

# 2 核机器上限制 worker 并发，防止 R8 三 flavor 同时压缩资源时 OOM。
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# configure-cache：对 Hilt/KSP/Room 等不完全兼容任务会自动降级（不命中而非失败），
# 配合 problems=warn 让降级只告警不中断构建。
org.gradle.configure-cache=true
org.gradle.problems=warn

android.useAndroidX=true
android.enableJetifier=true

android.suppressUnsupportedCompileSdk=37

# release 构建体积深度优化：
#   enableResourceOptimizations=true —— 让 AGP 对 res/ 做额外的资源重命名/去重与对齐优化，
#      仅在 isShrinkResources=true 时生效，对无引用资源进一步收敛。
#   enableR8.fullMode=true —— R8 全模式（R8 而非 ProGuard 兼容模式）：
#      额外做更激进的类/成员树摇、更深度的 inlining，通常能再砍 5%~10% dex 体积。
#      （本项目为纯 AGP 项目，不含依赖 R8 "compat" 行为的老插件，开 fullMode 是安全的。）
android.enableResourceOptimizations=true
android.enableR8.fullMode=true

# 强制 debug 变体也把 DEX/JNI so 做 ZIP DEFLATE 压缩。
# AGP 8+ 默认 debug 的 dex/jniLibs useLegacyPackaging=true（STORE 不压缩，用于提升模拟器首次安装速度），
# 但会让 debug APK 从 ~35MB 膨胀到 ~90MB。以下两个全局属性相当于在 debug buildTypes 之外
# 再用"最后一层锤"把 packagingOptions 的默认值强制改回 DEFLATE，
# 保证 debug 发出去的体积与老产物（armsolo 35MB 级别）一致。
# 注：release 变体已通过 buildTypes.release.packaging.dex/jniLibs 显式设置，与本属性无冲突。
android.packaging.dex.useLegacyPackaging=false
android.packaging.jniLibs.useLegacyPackaging=false

# ── 注意：代理配置 ──
# 如果你在国内需要代理才能访问 mavenCentral/google()，请创建 gradle-local.properties 并写入：
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=18080
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=18080
#   systemProp.http.nonProxyHosts=localhost|127.0.0.1
# 不要直接修改 gradle.properties，否则 CI (GitHub Actions) 会因代理不可用而构建失败。
